<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 980" width="1600" height="980" role="img" aria-label="BlockProbe architecture: CLI, orchestration, probe suite, OpenMinion runtime and provider, artifacts, analyst and approval gate">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4E6484"/>
    </marker>
  </defs>

  <rect width="1600" height="980" fill="#0B1220"/>

  <!-- Header -->
  <text x="56" y="66" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#E8EEF9">Architecture</text>
  <text x="56" y="96" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#8FA3BF">One run, isolated end to end. Progress on stderr, data on stdout.</text>
  <text x="1544" y="96" text-anchor="end" font-family="JetBrains Mono, Cascadia Code, Consolas, monospace" font-size="12" fill="#5F718D">openminion 0.1.x</text>

  <!-- ============ 01 COMMAND SURFACE ============ -->
  <rect x="56" y="142" width="8" height="8" fill="#F5B841"/>
  <text x="74" y="151" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="2.4" fill="#F5B841">01 · COMMAND SURFACE</text>

  <rect x="56" y="168" width="1016" height="84" rx="14" fill="#101A2A" stroke="#22324C" stroke-width="1.5"/>

  <g font-family="JetBrains Mono, Cascadia Code, Consolas, monospace" font-size="14" text-anchor="middle">
    <rect x="79" y="190" width="130" height="40" rx="8" fill="#0D1626" stroke="#24344F"/>
    <text x="144" y="215" fill="#A9BBD4">doctor</text>
    <rect x="219" y="190" width="130" height="40" rx="8" fill="#1E1A10" stroke="#F5B841"/>
    <text x="284" y="215" fill="#F5B841" font-weight="600">run</text>
    <rect x="359" y="190" width="130" height="40" rx="8" fill="#0D1626" stroke="#24344F"/>
    <text x="424" y="215" fill="#A9BBD4">analyze</text>
    <rect x="499" y="190" width="130" height="40" rx="8" fill="#0D1626" stroke="#24344F"/>
    <text x="564" y="215" fill="#A9BBD4">matrix</text>
    <rect x="639" y="190" width="130" height="40" rx="8" fill="#0D1626" stroke="#24344F"/>
    <text x="704" y="215" fill="#A9BBD4">diff</text>
    <rect x="779" y="190" width="130" height="40" rx="8" fill="#0D1626" stroke="#24344F"/>
    <text x="844" y="215" fill="#A9BBD4">report</text>
    <rect x="919" y="190" width="130" height="40" rx="8" fill="#0D1626" stroke="#24344F"/>
    <text x="984" y="215" fill="#A9BBD4">publish</text>
  </g>

  <!-- ============ 02 ORCHESTRATION ============ -->
  <rect x="56" y="288" width="8" height="8" fill="#58A6FF"/>
  <text x="74" y="297" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="2.4" fill="#58A6FF">02 · ORCHESTRATION</text>

  <g>
    <rect x="56" y="308" width="328" height="116" rx="12" fill="#111B2B" stroke="#22324C" stroke-width="1.5"/>
    <text x="76" y="340" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#E8EEF9">Runner</text>
    <text x="76" y="368" font-family="JetBrains Mono, Cascadia Code, Consolas, monospace" font-size="12.5" fill="#A9BBD4">repeats · timeout</text>
    <text x="76" y="394" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#6F819E">model-call budget per run</text>

    <rect x="400" y="308" width="328" height="116" rx="12" fill="#111B2B" stroke="#22324C" stroke-width="1.5"/>
    <text x="420" y="340" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#E8EEF9">Isolation</text>
    <text x="420" y="368" font-family="JetBrains Mono, Cascadia Code, Consolas, monospace" font-size="12.5" fill="#A9BBD4">OPENMINION_HOME</text>
    <text x="420" y="394" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#6F819E">DATA_ROOT + GENERATED_ROOT</text>

    <rect x="744" y="308" width="328" height="116" rx="12" fill="#111B2B" stroke="#22324C" stroke-width="1.5"/>
    <text x="764" y="340" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#E8EEF9">Environment</text>
    <text x="764" y="368" font-family="JetBrains Mono, Cascadia Code, Consolas, monospace" font-size="12.5" fill="#A9BBD4">OS · Python · SDK · provider</text>
    <text x="764" y="394" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#6F819E">doctor --check-turn --json</text>
  </g>

  <!-- ============ 03 PROBE SUITE ============ -->
  <rect x="56" y="460" width="8" height="8" fill="#3DDC97"/>
  <text x="74" y="469" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="2.4" fill="#3DDC97">03 · PROBE SUITE · DOCS-ANCHORED</text>

  <rect x="56" y="478" width="1016" height="200" rx="14" fill="#0E1726" stroke="#22324C" stroke-width="1.5"/>

  <g>
    <rect x="72" y="498" width="154" height="64" rx="8" fill="#111B2B" stroke="#24344F"/>
    <text x="86" y="524" font-family="JetBrains Mono, Cascadia Code, Consolas, monospace" font-size="14" fill="#F5B841">P01</text>
    <text x="86" y="547" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#A9BBD4">Contract</text>

    <rect x="238" y="498" width="154" height="64" rx="8" fill="#111B2B" stroke="#24344F"/>
    <text x="252" y="524" font-family="JetBrains Mono, Cascadia Code, Consolas, monospace" font-size="14" fill="#F5B841">P02</text>
    <text x="252" y="547" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#A9BBD4">Agent run</text>

    <rect x="404" y="498" width="154" height="64" rx="8" fill="#111B2B" stroke="#24344F"/>
    <text x="418" y="524" font-family="JetBrains Mono, Cascadia Code, Consolas, monospace" font-size="14" fill="#F5B841">P03</text>
    <text x="418" y="547" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#A9BBD4">Tools</text>

    <rect x="570" y="498" width="154" height="64" rx="8" fill="#111B2B" stroke="#24344F"/>
    <text x="584" y="524" font-family="JetBrains Mono, Cascadia Code, Consolas, monospace" font-size="14" fill="#F5B841">P04</text>
    <text x="584" y="547" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#A9BBD4">Sessions</text>

    <rect x="736" y="498" width="154" height="64" rx="8" fill="#111B2B" stroke="#24344F"/>
    <text x="750" y="524" font-family="JetBrains Mono, Cascadia Code, Consolas, monospace" font-size="14" fill="#F5B841">P05</text>
    <text x="750" y="547" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#A9BBD4">Streaming</text>

    <rect x="902" y="498" width="154" height="64" rx="8" fill="#111B2B" stroke="#24344F"/>
    <text x="916" y="524" font-family="JetBrains Mono, Cascadia Code, Consolas, monospace" font-size="14" fill="#F5B841">P06</text>
    <text x="916" y="547" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#A9BBD4">Errors</text>

    <rect x="155" y="578" width="154" height="64" rx="8" fill="#111B2B" stroke="#24344F"/>
    <text x="169" y="604" font-family="JetBrains Mono, Cascadia Code, Consolas, monospace" font-size="14" fill="#F5B841">P07</text>
    <text x="169" y="627" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#A9BBD4">Memory</text>

    <rect x="321" y="578" width="154" height="64" rx="8" fill="#111B2B" stroke="#24344F"/>
    <text x="335" y="604" font-family="JetBrains Mono, Cascadia Code, Consolas, monospace" font-size="14" fill="#F5B841">P08</text>
    <text x="335" y="627" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#A9BBD4">Permissions</text>

    <rect x="487" y="578" width="154" height="64" rx="8" fill="#111B2B" stroke="#24344F"/>
    <text x="501" y="604" font-family="JetBrains Mono, Cascadia Code, Consolas, monospace" font-size="14" fill="#F5B841">P09</text>
    <text x="501" y="627" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#A9BBD4">Delegation</text>

    <rect x="653" y="578" width="154" height="64" rx="8" fill="#111B2B" stroke="#24344F"/>
    <text x="667" y="604" font-family="JetBrains Mono, Cascadia Code, Consolas, monospace" font-size="14" fill="#F5B841">P10</text>
    <text x="667" y="627" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#A9BBD4">Diagnostics</text>

    <rect x="819" y="578" width="154" height="64" rx="8" fill="#111B2B" stroke="#24344F"/>
    <text x="833" y="604" font-family="JetBrains Mono, Cascadia Code, Consolas, monospace" font-size="14" fill="#F5B841">P11</text>
    <text x="833" y="627" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#A9BBD4">Structured output</text>
  </g>

  <!-- ============ 04 SYSTEM UNDER TEST ============ -->
  <rect x="56" y="710" width="8" height="8" fill="#58A6FF"/>
  <text x="74" y="719" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="2.4" fill="#58A6FF">04 · SYSTEM UNDER TEST</text>

  <rect x="56" y="728" width="660" height="150" rx="12" fill="#111B2B" stroke="#22324C" stroke-width="1.5"/>
  <text x="80" y="762" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#E8EEF9">OpenMinion 0.1.x</text>
  <text x="80" y="794" font-family="JetBrains Mono, Cascadia Code, Consolas, monospace" font-size="12.5" fill="#A9BBD4">Agent · @tool · sessions · streaming · cancel</text>
  <text x="80" y="818" font-family="JetBrains Mono, Cascadia Code, Consolas, monospace" font-size="12.5" fill="#A9BBD4">memory · handoff · approvals · structured output</text>
  <text x="80" y="852" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#6F819E">Real SDK, real turns. No mocks in a probe run.</text>

  <rect x="732" y="728" width="340" height="150" rx="12" fill="#111B2B" stroke="#22324C" stroke-width="1.5"/>
  <text x="756" y="762" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#E8EEF9">Provider</text>
  <text x="756" y="794" font-family="JetBrains Mono, Cascadia Code, Consolas, monospace" font-size="12.5" fill="#A9BBD4">Cortensor · OpenAI-compatible</text>
  <text x="756" y="818" font-family="JetBrains Mono, Cascadia Code, Consolas, monospace" font-size="12.5" fill="#A9BBD4">echo · offline harness tests</text>
  <text x="756" y="852" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#6F819E">Swappable per run.</text>

  <!-- ============ CONNECTORS (main column) ============ -->
  <g stroke="#4E6484" stroke-width="2" fill="none">
    <line x1="564" y1="256" x2="564" y2="296" marker-end="url(#arrow)"/>
    <line x1="564" y1="428" x2="564" y2="468" marker-end="url(#arrow)"/>
    <line x1="564" y1="682" x2="564" y2="716" marker-end="url(#arrow)"/>
    <path d="M1072 578 H1092 V243 H1102" marker-end="url(#arrow)"/>
  </g>

  <!-- ============ RIGHT COLUMN ============ -->
  <rect x="1112" y="142" width="8" height="8" fill="#3DDC97"/>
  <text x="1130" y="151" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="2.4" fill="#3DDC97">ARTIFACTS &amp; AGENTS</text>

  <!-- runs -->
  <rect x="1112" y="168" width="432" height="150" rx="12" fill="#111B2B" stroke="#22324C" stroke-width="1.5"/>
  <text x="1136" y="202" font-family="JetBrains Mono, Cascadia Code, Consolas, monospace" font-size="16" font-weight="600" fill="#F5B841">runs/&lt;id&gt;/</text>
  <text x="1136" y="232" font-family="JetBrains Mono, Cascadia Code, Consolas, monospace" font-size="12.5" fill="#A9BBD4">results.json · findings.json</text>
  <text x="1136" y="256" font-family="JetBrains Mono, Cascadia Code, Consolas, monospace" font-size="12.5" fill="#A9BBD4">evidence/ · logs/</text>
  <text x="1136" y="286" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#6F819E">Redacted before anything is written.</text>

  <!-- report -->
  <rect x="1112" y="342" width="432" height="110" rx="12" fill="#111B2B" stroke="#22324C" stroke-width="1.5"/>
  <text x="1136" y="374" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#E8EEF9">Report and diff</text>
  <text x="1136" y="402" font-family="JetBrains Mono, Cascadia Code, Consolas, monospace" font-size="12.5" fill="#A9BBD4">building-blocks-tested.md</text>
  <text x="1136" y="426" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#6F819E">regressions · fixes · pass rate · latency</text>

  <!-- analyst -->
  <rect x="1112" y="476" width="432" height="110" rx="12" fill="#111B2B" stroke="#22324C" stroke-width="1.5"/>
  <text x="1136" y="508" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#E8EEF9">Analyst agent</text>
  <text x="1136" y="536" font-family="JetBrains Mono, Cascadia Code, Consolas, monospace" font-size="12.5" fill="#A9BBD4">what-we-learned.md</text>
  <text x="1136" y="560" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#6F819E">every finding carries an evidence ref</text>

  <!-- drafter -->
  <rect x="1112" y="610" width="432" height="100" rx="12" fill="#111B2B" stroke="#22324C" stroke-width="1.5"/>
  <text x="1136" y="642" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#E8EEF9">Issue drafter</text>
  <text x="1136" y="670" font-family="JetBrains Mono, Cascadia Code, Consolas, monospace" font-size="12.5" fill="#A9BBD4">issues/ISSUE-01.md</text>
  <text x="1136" y="694" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#6F819E">FAIL and FLAKY only, never ERROR</text>

  <!-- gate -->
  <rect x="1112" y="734" width="432" height="116" rx="12" fill="#1E1A10" stroke="#F5B841" stroke-width="1.5"/>
  <text x="1136" y="766" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#F5B841">Human approval</text>
  <text x="1136" y="792" font-family="JetBrains Mono, Cascadia Code, Consolas, monospace" font-size="12.5" fill="#E8EEF9">type PUBLISH to confirm</text>
  <text x="1136" y="818" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#A9BBD4">optional, manual → gh issue create</text>

  <g stroke="#4E6484" stroke-width="2" fill="none">
    <line x1="1328" y1="318" x2="1328" y2="334" marker-end="url(#arrow)"/>
    <line x1="1328" y1="452" x2="1328" y2="468" marker-end="url(#arrow)"/>
    <line x1="1328" y1="586" x2="1328" y2="602" marker-end="url(#arrow)"/>
    <line x1="1328" y1="710" x2="1328" y2="726" marker-end="url(#arrow)"/>
  </g>

  <!-- Footer -->
  <text x="56" y="936" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#6F819E">Isolated per run · redacted before storage · a failing probe never aborts the run · nothing leaves the machine without a human.</text>
</svg>

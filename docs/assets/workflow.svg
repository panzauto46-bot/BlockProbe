<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 460" width="1600" height="460" role="img" aria-label="BlockProbe workflow: doctor, run, analyze, report and diff, publish, then repeat on the next OpenMinion release">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4E6484"/>
    </marker>
  </defs>

  <rect width="1600" height="460" fill="#0B1220"/>

  <text x="56" y="66" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#E8EEF9">The loop</text>
  <text x="56" y="96" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#8FA3BF">One command per beat. Every artifact is re-renderable from results.json.</text>

  <!-- Card 01 -->
  <rect x="56" y="130" width="272" height="210" rx="12" fill="#111B2B" stroke="#22324C" stroke-width="1.5"/>
  <text x="80" y="166" font-family="JetBrains Mono, Cascadia Code, Consolas, monospace" font-size="12" fill="#5F718D">01</text>
  <text x="80" y="200" font-family="JetBrains Mono, Cascadia Code, Consolas, monospace" font-size="19" font-weight="600" fill="#E8EEF9">doctor</text>
  <text x="80" y="230" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#A9BBD4">Environment, provider, budget.</text>
  <text x="80" y="250" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#A9BBD4">Six checks, one verdict.</text>
  <line x1="80" y1="272" x2="304" y2="272" stroke="#22324C" stroke-width="1.5"/>
  <text x="80" y="298" font-family="JetBrains Mono, Cascadia Code, Consolas, monospace" font-size="11.5" fill="#F5B841">next: run --profile quick</text>

  <!-- Card 02 -->
  <rect x="360" y="130" width="272" height="210" rx="12" fill="#111B2B" stroke="#22324C" stroke-width="1.5"/>
  <text x="384" y="166" font-family="JetBrains Mono, Cascadia Code, Consolas, monospace" font-size="12" fill="#5F718D">02</text>
  <text x="384" y="200" font-family="JetBrains Mono, Cascadia Code, Consolas, monospace" font-size="19" font-weight="600" fill="#F5B841">run</text>
  <text x="384" y="230" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#A9BBD4">Isolated probes, live lines.</text>
  <text x="384" y="250" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#A9BBD4">PASS · FLAKY · FAIL · SKIP · ERROR</text>
  <line x1="384" y1="272" x2="608" y2="272" stroke="#22324C" stroke-width="1.5"/>
  <text x="384" y="298" font-family="JetBrains Mono, Cascadia Code, Consolas, monospace" font-size="11.5" fill="#3DDC97">runs/&lt;id&gt;/results.json</text>

  <!-- Card 03 -->
  <rect x="664" y="130" width="272" height="210" rx="12" fill="#111B2B" stroke="#22324C" stroke-width="1.5"/>
  <text x="688" y="166" font-family="JetBrains Mono, Cascadia Code, Consolas, monospace" font-size="12" fill="#5F718D">03</text>
  <text x="688" y="200" font-family="JetBrains Mono, Cascadia Code, Consolas, monospace" font-size="19" font-weight="600" fill="#E8EEF9">analyze</text>
  <text x="688" y="230" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#A9BBD4">Analyst reads the results.</text>
  <text x="688" y="250" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#A9BBD4">Findings tied to evidence.</text>
  <line x1="688" y1="272" x2="912" y2="272" stroke="#22324C" stroke-width="1.5"/>
  <text x="688" y="298" font-family="JetBrains Mono, Cascadia Code, Consolas, monospace" font-size="11.5" fill="#3DDC97">what-we-learned.md</text>

  <!-- Card 04 -->
  <rect x="968" y="130" width="272" height="210" rx="12" fill="#111B2B" stroke="#22324C" stroke-width="1.5"/>
  <text x="992" y="166" font-family="JetBrains Mono, Cascadia Code, Consolas, monospace" font-size="12" fill="#5F718D">04</text>
  <text x="992" y="200" font-family="JetBrains Mono, Cascadia Code, Consolas, monospace" font-size="19" font-weight="600" fill="#E8EEF9">report / diff</text>
  <text x="992" y="230" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#A9BBD4">The graded table.</text>
  <text x="992" y="250" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#A9BBD4">Regressions and fixes.</text>
  <line x1="992" y1="272" x2="1216" y2="272" stroke="#22324C" stroke-width="1.5"/>
  <text x="992" y="298" font-family="JetBrains Mono, Cascadia Code, Consolas, monospace" font-size="11.5" fill="#3DDC97">building-blocks-tested.md</text>

  <!-- Card 05 -->
  <rect x="1272" y="130" width="272" height="210" rx="12" fill="#1E1A10" stroke="#F5B841" stroke-width="1.5"/>
  <text x="1296" y="166" font-family="JetBrains Mono, Cascadia Code, Consolas, monospace" font-size="12" fill="#A9BBD4">05</text>
  <text x="1296" y="200" font-family="JetBrains Mono, Cascadia Code, Consolas, monospace" font-size="19" font-weight="600" fill="#F5B841">publish</text>
  <text x="1296" y="230" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#E8EEF9">Manual, typed confirmation.</text>
  <text x="1296" y="250" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#A9BBD4">Security drafts fail closed.</text>
  <line x1="1296" y1="272" x2="1520" y2="272" stroke="#3D3520" stroke-width="1.5"/>
  <text x="1296" y="298" font-family="JetBrains Mono, Cascadia Code, Consolas, monospace" font-size="11.5" fill="#F5B841">issues/ISSUE-01.md</text>

  <!-- Arrows between cards -->
  <g stroke="#4E6484" stroke-width="2" fill="none">
    <line x1="332" y1="235" x2="352" y2="235" marker-end="url(#arrow)"/>
    <line x1="636" y1="235" x2="656" y2="235" marker-end="url(#arrow)"/>
    <line x1="940" y1="235" x2="960" y2="235" marker-end="url(#arrow)"/>
    <line x1="1244" y1="235" x2="1264" y2="235" marker-end="url(#arrow)"/>
  </g>

  <!-- Repeat loop -->
  <g stroke="#4E6484" stroke-width="2" fill="none">
    <path d="M1104 340 V396 H192 V344" marker-end="url(#arrow)"/>
  </g>
  <rect x="590" y="382" width="220" height="28" fill="#0B1220"/>
  <text x="700" y="401" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#6F819E">repeat on the next release</text>
</svg>
